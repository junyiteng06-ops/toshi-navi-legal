<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資ナビ【初心者向け】</title>
<style>
  :root {
    --paper: #fbf8f3;
    --ink: #1c1a17;
    --ink-soft: #5b5650;
    --ink-faint: #8a8478;
    --accent: #b45f04;
    --accent-bg: #fdf1e0;
    --line: #e8e1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15130f;
      --ink: #f2ede4;
      --ink-soft: #b4ab9c;
      --ink-faint: #7d7565;
      --accent: #f2a93b;
      --accent-bg: #2b2011;
      --line: #332c20;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.85;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 24px 96px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 48px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }
  .brand-name {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  h1 {
    font-size: clamp(28px, 5vw, 36px);
    line-height: 1.35;
    margin: 0 0 20px;
  }
  p {
    color: var(--ink-soft);
    font-size: 16px;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 32px;
  }
  a.button {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
  }
  a.text-link {
    color: var(--accent);
    font-size: 14px;
  }
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 13px;
    display: flex;
    gap: 20px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">投資ナビ【初心者向け】</span>
  </div>
  <h1>決算・株価・投資指標を、1分で簡単解説</h1>
  <p>上場企業の決算発表や、PER・PBRといった投資の基礎知識を、初心者向けにショート動画で分かりやすく解説しています。YouTube・TikTokで配信中です。</p>
  <div class="links">
    <a class="button" href="https://www.youtube.com/@toshi_navi" target="_blank" rel="noopener">YouTubeを見る</a>
    <a class="button" href="https://www.tiktok.com/@toshi_navi" target="_blank" rel="noopener">TikTokを見る</a>
  </div>
  <footer>
    <a class="text-link" href="./terms.html">利用規約</a>
    <a class="text-link" href="./privacy.html">プライバシーポリシー</a>
  </footer>
</div>
</body>
</html>
